name: Agent OS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js for Runtime Adapter tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Runtime Adapter contracts and host mappings
        run: npm test --prefix runtime
      - name: Check Runtime Adapter registry and deployment gates
        run: python3 scripts/check_runtime_registry.py
      - name: Check Markdown, links, Skills and adapters
        run: python3 scripts/check_docs.py
      - name: Check employee registry and lifecycle
        run: python3 scripts/check_agent_registry.py
      - name: Check experience proposal privacy and promotion gates
        run: python3 scripts/check_experience_proposals.py
      - name: Check voice command privacy and confirmation gates
        run: python3 scripts/check_voice_commands.py

  runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js for Runtime Adapter tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Runtime Adapter contracts and Windows file ledger
        run: npm test --prefix runtime
